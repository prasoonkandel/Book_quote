name: Keep Aiven Database Alive
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-24.04 # Pinned to avoid deprecation notices
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # Fixed version

      - name: Install dependencies
        run: pip install sqlalchemy pymysql

      - name: Execute dummy query
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          python -c "
          import os
          from sqlalchemy import create_engine, text

          db_url = os.getenv('DB_URL')
          if not db_url:
              raise ValueError('DB_URL secret is missing or empty!')

          # Aiven MySQL requires SSL parameters to connect securely
          connect_args = {'ssl': {'fake_user': True}}

          engine = create_engine(db_url, connect_args=connect_args)

          with engine.connect() as conn:
              conn.execute(text('SELECT 1'))
          print('Keep alive ping successful!')
          "
