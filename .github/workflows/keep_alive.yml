name: Keep Aiven Database Alive
on:
  schedule:
    - cron: "0 */6 * * *" # Runs automatically every 6 hours
  workflow_dispatch: # Allows you to test it manually with a single button click!

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install sqlalchemy pymysql

      - name: Execute dummy query
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          python -c "
          import os
          from sqlalchemy import create_engine, text

          db_url = os.getenv('DB_URL')
          if not db_url:
              raise ValueError('DB_URL secret is missing or empty!')

          engine = create_engine(db_url)
          with engine.connect() as conn:
              conn.execute(text('SELECT 1'))
          print('Keep alive ping successful!')
          "
