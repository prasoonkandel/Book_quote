name: Keep Aiven Database Alive
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install sqlalchemy pymysql

      - name: Execute dummy query
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          python -c "
          import os
          from sqlalchemy import create_engine, text

          raw_url = os.getenv('DB_URL')
          if not raw_url:
              raise ValueError('DB_URL secret is missing or empty!')

          # 1. Ensure the URL uses mysql+pymysql instead of a plain mysql protocol
          if raw_url.startswith('mysql://'):
              raw_url = raw_url.replace('mysql://', 'mysql+pymysql://', 1)

          # 2. Force Aiven SSL requirements directly via the URL query parameters
          joiner = '&' if '?' in raw_url else '?'
          ssl_url = f'{raw_url}{joiner}ssl_mode=REQUIRED'

          print('Attempting connection to database...')
          engine = create_engine(ssl_url)

          with engine.connect() as conn:
              conn.execute(text('SELECT 1'))
          print('Keep alive ping successful!')
          "
