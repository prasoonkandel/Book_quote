name: Keep Aiven Database Alive

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install sqlalchemy pymysql

      - name: Execute keep-alive query
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          raw_url = os.getenv("DB_URL")
          if not raw_url:
              raise ValueError("The DB_URL GitHub secret is missing or empty.")

          # Ensure SQLAlchemy uses the PyMySQL driver.
          if raw_url.startswith("mysql://"):
              raw_url = raw_url.replace(
                  "mysql://",
                  "mysql+pymysql://",
                  1,
              )

          # PyMySQL does not support ssl_mode / ssl-mode URL options.
          # Remove them while keeping all other URL settings intact.
          db_url = make_url(raw_url).difference_update_query(
              ["ssl_mode", "ssl-mode"]
          )

          print("Attempting connection to database...")
          engine = create_engine(
              db_url,
              pool_pre_ping=True,
              connect_args={"connect_timeout": 30},
          )

          with engine.connect() as connection:
              connection.execute(text("SELECT 1"))

          engine.dispose()
          print("Keep alive ping successful!")
          PY
